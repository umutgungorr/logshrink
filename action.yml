name: 'LogShrink Log Cleaner'
description: 'Deduplicate noisy CI polling logs and auto-highlight error traces in GitHub Actions'
author: 'Umut Güngör'

branding:
  icon: 'filter'
  color: 'blue'

inputs:
  log-file:
    description: 'Path to the log file to clean and analyze'
    required: true
  summary:
    description: 'Write formatted markdown incident and noise reduction report to $GITHUB_STEP_SUMMARY'
    required: false
    default: 'true'
  export-file:
    description: 'Optional file path to export the markdown incident report'
    required: false
    default: ''
  options:
    description: 'Additional flags to pass to logshrink (e.g. --errors-only, --preset docker)'
    required: false
    default: ''
  fail-on-error:
    description: 'Fail the action step with exit code 1 if any error incidents are detected'
    required: false
    default: 'false'

outputs:
  incident-count:
    description: 'Total number of detected error incidents'
    value: ${{ steps.run-logshrink.outputs.incident-count }}
  reduced-percentage:
    description: 'Percentage of repetitive noise lines suppressed'
    value: ${{ steps.run-logshrink.outputs.reduced-percentage }}
  suppressed-lines:
    description: 'Total number of repetitive noise lines suppressed'
    value: ${{ steps.run-logshrink.outputs.suppressed-lines }}
  total-lines:
    description: 'Total log lines processed'
    value: ${{ steps.run-logshrink.outputs.total-lines }}

runs:
  using: 'composite'
  steps:
    - name: Run LogShrink Action
      id: run-logshrink
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_LOG_FILE: ${{ inputs.log-file }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_EXPORT_FILE: ${{ inputs.export-file }}
        INPUT_OPTIONS: ${{ inputs.options }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        PYTHON_BIN="python"
        if ! command -v python &> /dev/null; then
          PYTHON_BIN="python3"
        fi

        # Optional: install logshrink CLI if pip is available
        if "$PYTHON_BIN" -m pip --version &> /dev/null; then
          "$PYTHON_BIN" -m pip install --quiet --no-warn-script-location "$ACTION_PATH" 2>/dev/null || \
          "$PYTHON_BIN" -m pip install --quiet --break-system-packages --no-warn-script-location "$ACTION_PATH" 2>/dev/null || true
        fi

        # Ensure action source directory is always available on PYTHONPATH
        export PYTHONPATH="$ACTION_PATH/src${PYTHONPATH:+:$PYTHONPATH}"

        "$PYTHON_BIN" -m logshrink.action
